<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProTrade SMC Terminal</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://s3.tradingview.com/tv.js"></script>
<style>
  body { background:#0f172a; color:#e2e8f0; font-family:system-ui,-apple-system,sans-serif; }
  .card { background:#1e293b; border:1px solid #334155; }
  .b-buy  { background:rgba(16,185,129,.2); color:#10b981; border:1px solid #10b981; }
  .b-sell { background:rgba(239,68,68,.2);  color:#ef4444; border:1px solid #ef4444; }
  .b-wait { background:rgba(245,158,11,.2); color:#f59e0b; border:1px solid #f59e0b; }
  .b-none { background:rgba(100,116,139,.2); color:#94a3b8; border:1px solid #64748b; }
  .tp-hit { background:rgba(16,185,129,.25) !important; text-decoration:line-through; opacity:.7; }
  .sl-hit { background:rgba(239,68,68,.3) !important; text-decoration:line-through; opacity:.7; }
  .flash { animation:flash .5s ease-out; }
  @keyframes flash { from { background-color:rgba(16,185,129,.3); } to { background-color:#1e293b; } }
  select, input { color-scheme: dark; }
</style>
</head>
<body class="p-2 sm:p-4 md:p-6">

<div class="max-w-7xl mx-auto space-y-4">

  <!-- HEADER -->
  <header class="flex flex-col sm:flex-row justify-between items-center pb-3 border-b border-slate-700 gap-2">
    <div>
      <h1 class="text-xl md:text-2xl font-bold text-white"><span class="text-amber-400">⚡</span> ProTrade SMC Terminal</h1>
      <p class="text-xs text-slate-400">Bias dari struktur (BOS/CHoCH) · Entry di FVG · Target dari swing likuiditas</p>
    </div>
    <div class="flex items-center gap-3">
      <span id="srcBadge" class="text-xs px-2.5 py-1 rounded-full border font-semibold b-none">—</span>
      <span id="clock" class="text-xs text-slate-400 font-mono">--:--:--</span>
    </div>
  </header>

  <!-- KONTROL -->
